# Deploys the site to GitHub Pages. File URLs get the commit hash (?v=...) so a
# browser never mixes a cached old file with a new one after a deploy.
name: Deploy
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - name: Copy site files and version their URLs
        run: |
          v=${GITHUB_SHA::8}
          mkdir site && cp index.html app.js rank.js style.css site/
          sed -i "s/\(app\.js\|style\.css\)\"/\1?v=$v\"/g" site/index.html
          sed -i "s|'./rank.js'|'./rank.js?v=$v'|" site/app.js
          grep -c "?v=$v" site/index.html site/app.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deploy
        uses: actions/deploy-pages@v4
